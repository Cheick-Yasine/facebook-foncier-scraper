[project]
name = "facebook-foncier-scraper"
version = "0.1.0"
description = "Pipeline de scraping des annonces foncières Facebook (Ouagadougou)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright==1.47.0",
    "python-dotenv==1.0.1",
    "httpx>=0.27.0",
    "openai==2.52.0",
    "pydantic==2.9.2",
    "psycopg[binary]==3.3.4",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[project.scripts]
foncier-scraper = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
python-preference = "managed"
